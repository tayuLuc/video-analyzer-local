version: '3.8'

services:
  video-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-analyzer-web
    ports:
      - "8000:8000"
    environment:
      # Endpoint: any OpenAI-compatible /v1 server.
      # LiteLLM :4000/v1, vLLM :8000/v1, llama.cpp :8080/v1, Ollama :11434/v1
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:4000/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-}

      # Processing settings
      - CHUNK_DURATION_MINUTES=${CHUNK_DURATION_MINUTES:-10}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-0}
      - CHUNK_SPLIT_MODE=${CHUNK_SPLIT_MODE:-fixed}
      - SILENCE_WINDOW_SECONDS=${SILENCE_WINDOW_SECONDS:-120}
      - SILENCE_MIN_DURATION_SECONDS=${SILENCE_MIN_DURATION_SECONDS:-3.0}
      - SILENCE_NOISE_DB=${SILENCE_NOISE_DB:--35.0}

      # Directories (inside container)
      - UPLOAD_DIRECTORY=/app/uploads
      - OUTPUT_DIRECTORY=/app/outputs
      - TEMP_DIRECTORY=/app/temporary
      - PROMPTS_DIRECTORY=/app/prompts
    volumes:
      # Persist uploads and outputs
      - video_uploads:/app/uploads
      - video_outputs:/app/outputs
      # Mount custom prompts (optional)
      # - ./custom_prompts:/app/prompts:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  video_uploads:
    driver: local
  video_outputs:
    driver: local
