services:
  video-analyzer:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: video-analyzer-web
    ports:
      - "4000:8000"
    environment:
      # Analyzer settings
      - ANALYZER_TYPE=${ANALYZER_TYPE:-gemini}

      # Gemini settings (optional - can be set via web interface)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL_NAME=${GEMINI_MODEL_NAME:-gemini-2.0-flash}

      # OpenRouter settings (optional - can be set via web interface)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENROUTER_MODEL_NAME=${OPENROUTER_MODEL_NAME:-google/gemini-2.0-flash-exp:free}

      # OpenAI settings
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-http://host.docker.internal:8001/v1}

      # Processing settings
      - CHUNK_DURATION_MINUTES=${CHUNK_DURATION_MINUTES:-10}
      - MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB:-500}

      # Directories (inside container)
      - UPLOAD_DIRECTORY=/app/uploads
      - OUTPUT_DIRECTORY=/app/outputs
      - TEMP_DIRECTORY=/app/temporary
      - PROMPTS_DIRECTORY=/app/prompts
    tmpfs:
      - /app/uploads:size=1G,mode=1777
      - /app/temporary:size=1G,mode=1777
    volumes:
      # Outputs: Persist to local disk
      - type: bind
        source: ./outputs
        target: /app/outputs
        
      # Mount custom prompts (optional)
      # - type: bind
      #   source: ./custom_prompts
      #   target: /app/prompts
      #   read_only: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/config"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
